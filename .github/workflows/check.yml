# push/PR마다 pnpm check(테스트 + 데이터 lint + 빌드 + smoke) 자동 실행.
# 콘텐츠는 이제 Neon에 저장되고 커밋을 만들지 않는다 — 여기 오는 것은 코드 변경뿐이다.
# workflow_dispatch는 이벤트 전달이 막혀 있어도(계정 플래그) 손으로 돌릴 수 있게 한다.
#
# action 버전은 Node 24 런타임을 쓰는 최신 메이저로 맞춘다 — v4는 Node 20 기반이라
# "Node.js 20 actions are deprecated" 경고가 매 실행마다 붙었다.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 매주 화요일 03:23 KST. 기존 원본 검증기를 그대로 실행하며 콘텐츠는 쓰지 않는다.
  schedule:
    - cron: "23 18 * * 1"

# 같은 브랜치에 커밋이 연달아 오면 이전 실행은 취소한다 — 무료 Actions 분을
# 이미 낡은 커밋 검증에 쓰지 않는다.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # 버전은 package.json의 packageManager를 따른다
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/needs-work.mjs
      - name: Restore private Instagram source export
        env:
          INSTAGRAM_EXPORT_URL: ${{ secrets.INSTAGRAM_EXPORT_URL }}
        run: |
          test -n "$INSTAGRAM_EXPORT_URL" || { echo "::error::INSTAGRAM_EXPORT_URL secret is required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/instagram-export"
          curl --fail --location --silent --show-error "$INSTAGRAM_EXPORT_URL" -o "$RUNNER_TEMP/instagram-export.zip"
          unzip -q "$RUNNER_TEMP/instagram-export.zip" -d "$RUNNER_TEMP/instagram-export"
          posts_file="$(find "$RUNNER_TEMP/instagram-export" -path '*/your_instagram_activity/media/posts_1.json' -print -quit)"
          test -n "$posts_file" || { echo "::error::posts_1.json not found in export"; exit 1; }
          export_root="$(dirname "$(dirname "$(dirname "$posts_file")")")"
          echo "INSTAGRAM_EXPORT_DIR=$export_root" >> "$GITHUB_ENV"
      - name: Verify Instagram originals
        run: pnpm verify:instagram -- "$INSTAGRAM_EXPORT_DIR"
      - name: Install layout-check browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify narrow and wide layouts
        run: |
          pnpm exec next start -p 3401 > "$RUNNER_TEMP/lyra-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:3401/ > /dev/null && break
            sleep 0.5
          done
          node scripts/verify-layout.mjs http://localhost:3401
