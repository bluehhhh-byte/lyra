name: database backup

on:
  schedule:
    - cron: "17 18 * * *" # 03:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dump Neon content to repository files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/dump-content.mjs
      - name: Preserve one atomic snapshot commit as a dated tag
        env:
          BACKUP_DAY: ${{ github.run_started_at }}
        run: |
          tag="db-backup-$(TZ=Asia/Seoul date -d "$BACKUP_DAY" +%F)"
          git fetch --tags --force
          git rev-parse "$tag" >/dev/null 2>&1 && { echo "$tag already exists"; exit 0; }
          git config user.name "lyra-backup[bot]"
          git config user.email "lyra-backup[bot]@users.noreply.github.com"
          git add -A -- songs movies data
          git diff --cached --quiet && { echo "No database changes"; exit 0; }
          git commit -m "backup: Neon content $tag"
          git tag "$tag"
          git push origin "refs/tags/$tag"
