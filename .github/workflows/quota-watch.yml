name: quota-watch

# 무료티어가 소진된 뒤가 아니라 소진 전에 알기 위한 매일 점검.
# 판정 규칙과 리포트 문안은 lib/quota-watch.js에 있고 단위 테스트가 붙어 있다 —
# 여기에 로직을 적지 않는 이유는 YAML을 테스트할 수 없기 때문이다.
on:
  schedule:
    # 04:07 KST = 19:07 UTC 전날. 정각을 피한 건 러너가 몰리는 시각을 비켜서다.
    - cron: "7 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quota-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 의존성 설치를 하지 않는다. 점검 스크립트는 fetch와 표준 라이브러리만
      # 쓰고, DATABASE_URL이 있을 때만 @neondatabase/serverless를 동적으로
      # 부른다 — 없으면 AI 호출 줄만 빠지고 나머지는 그대로 보고된다.
      - name: 점검 실행
        id: watch
        env:
          LYRA_SITE_URL: ${{ vars.LYRA_SITE_URL || 'https://lyracyno.vercel.app' }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        continue-on-error: true
        run: |
          set +e
          node scripts/quota-watch.mjs > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: 요약에 리포트 붙이기
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      # 경보(exit 2)이거나 수집 실패(exit 1)면 이슈를 연다. 같은 제목의 열린
      # 이슈가 이미 있으면 새로 만들지 않고 코멘트만 단다 — 매일 도는 워크플로라
      # 그냥 만들면 한 달에 서른 개가 쌓인다.
      - name: 경보 이슈 열기 또는 갱신
        if: steps.watch.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 무료티어 한도 경보
        run: |
          BODY="$(cat report.md)"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "기존 이슈 #$EXISTING 에 코멘트를 달았습니다."
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: 경보면 실패로 남기기
        if: steps.watch.outputs.status != '0'
        run: |
          echo "점검이 exit ${{ steps.watch.outputs.status }}로 끝났습니다 (2=경보, 1=수집 실패)."
          exit 1
